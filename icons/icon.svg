<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- CRT Terminal Black Background with Neon Glow Border -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#0d1117" stroke="#00ff00" stroke-width="6" />
  
  <!-- Subtle Scanline / CRT Screen Grid Details -->
  <line x1="12" y1="36" x2="116" y2="36" stroke="#003300" stroke-width="2" />
  <line x1="12" y1="64" x2="116" y2="64" stroke="#003300" stroke-width="2" />
  <line x1="12" y1="92" x2="116" y2="92" stroke="#003300" stroke-width="2" />

  <!-- Speed Motion Blur Lines (Marathon Runner Vibe) -->
  <path d="M22 42 H40" stroke="#00ff00" stroke-width="5" stroke-linecap="round" stroke-opacity="0.4" />
  <path d="M18 58 H34" stroke="#00ff00" stroke-width="5" stroke-linecap="round" stroke-opacity="0.7" />
  <path d="M22 74 H38" stroke="#00ff00" stroke-width="5" stroke-linecap="round" stroke-opacity="0.4" />

  <!-- Sharp Neon Green Cursor Pointer with Drop Shadow -->
  <polygon points="46,24 46,94 64,76 78,104 90,98 76,70 98,70" 
           fill="#00ff00" 
           stroke="#000000" 
           stroke-width="5" 
           stroke-linejoin="round" />

  <!-- Small Digital Milestone Alert Dot -->
  <circle cx="102" cy="28" r="7" fill="#ff0055" stroke="#ffffff" stroke-width="2" />
</svg>
